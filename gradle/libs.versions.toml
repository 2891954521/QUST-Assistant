[versions]
agp = "9.0.1"

android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

kotlin = "2.4.0"
kotlinx-datetime = "0.8.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.11.0"

androidx-core = "1.19.0"
androidx-appcompat = "1.7.1"
androidx-annotation = "1.9.1"
androidx-activity = "1.13.0"
androidx-navigation-compose = "2.9.8"
androidx-material-icons = "1.7.8"
androidx-windowSizeClass = "1.4.0"

androidx-lifecycle = "2.11.0-beta01"

androidx-espresso = "3.7.0"

composeMultiplatform = "1.11.1"
compose-material = "1.11.1"
compose-material3 = "1.9.0"

ksp = "2.3.10"
kotlinpoet = "2.3.0"

ui-fluent = "0.2.0-SNAPSHOT"

ktor = "3.5.1"
room3 = "3.0.0"
sqlite = "2.6.2"
settings = "1.3.0"

jvm-log4j = "1.2.17"

junit = "4.13.2"
androidx-testExt = "1.3.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-material-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "androidx-material-icons" }
